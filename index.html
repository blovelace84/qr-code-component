<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | QR code component</title>
</head>
<body>
  <main class="qr-container">
    <p>Scan the QR Code Here:</p>
    <div class="qr-code-wrapper">
        <div class="desktop-design">
            <!-- Desktop version of QR code -->
            <img src="design/desktop-design.jpg" alt="Desktop version of QR code">
        </div>
        <div class="mobile-design">
            <!-- Mobile version of QR code -->
            <img src="design/mobile-design.jpg" alt="Mobile version of QR code">
        </div>
    </div>
  </main>
</body>
</html>
